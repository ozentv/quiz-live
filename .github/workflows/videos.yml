name: Vidéos quiz

on:
  workflow_dispatch:
    inputs:
      themes:
        description: "Thèmes séparés par des espaces (ex : om psg football), ou « tout » pour tous les thèmes"
        default: "tout"
      questions:
        description: "Nombre de questions par vidéo"
        default: "5"
      seconds:
        description: "Secondes pour répondre"
        default: "3"
      copies:
        description: "Nombre de vidéos par thème"
        default: "1"

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Outils
        timeout-minutes: 25
        run: |
          # Les miroirs Ubuntu de GitHub tombent parfois : on réessaie au lieu de rester bloqué.
          for i in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && sudo apt-get install -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 ffmpeg fonts-noto-color-emoji && break
            echo "Nouvel essai dans 30 s"; sleep 30
          done
          command -v ffmpeg
          (cd relay && npm ci --omit=dev)
          (cd tools/video && npm install && npx playwright install --with-deps chromium)
      - name: Fabrication des vidéos
        env:
          THEMES: ${{ inputs.themes }}
          NQ: ${{ inputs.questions }}
          SEC: ${{ inputs.seconds }}
          COPIES: ${{ inputs.copies }}
        run: |
          python3 -m http.server 8077 > /dev/null 2>&1 &
          (cd relay && PORT=10077 ADMIN_KEY=k node server.js > /tmp/relay.log 2>&1 &)
          sleep 3
          if [ "$THEMES" = "tout" ] || [ "$THEMES" = "all" ]; then THEMES="$(grep -oP '^    \K[a-z0-9]+(?=: \{ title:)' index.html | tr '\n' ' ')"; fi
          tools/video/make.sh "$THEMES" "$NQ" "$SEC" out "${COPIES:-1}"
      - name: Mise en ligne
        run: |
          gh release view videos > /dev/null 2>&1 || gh release create videos --title "Vidéos quiz" --notes "Vidéos Studio Quiz" --prerelease
          gh release upload videos out/*.mp4 --clobber
          python3 tools/video/publish.py out
